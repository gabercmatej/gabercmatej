<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700" role="img" aria-label="Matej Gaberc: from idea to working software. ASCII portrait with lines to researching, building and automating; define problem, design solution, build product.">
<style>
.bg{fill:#ffffff}
.serif{font-family:Georgia,'Times New Roman',Times,serif;fill:#111827}
.sans{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#6b7280}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
.label{fill:#6b7280;font-size:13px;letter-spacing:3px}
.plabel{fill:#2563eb;font-size:13px;letter-spacing:2.5px;font-weight:700}
.pill{fill:#eff6ff;stroke:#2563eb;stroke-width:1.2}
.rule{stroke:#e5e7eb;stroke-width:1}
.face{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;font-size:11px;font-weight:700;fill:url(#fg);opacity:0;animation:rowin .5s ease forwards}
.wire{fill:none;stroke:#2563eb;stroke-width:2;opacity:.35}
.wire2{fill:none;stroke:#2563eb;stroke-width:2.6;stroke-linecap:round;stroke-dasharray:70 600;animation:run 2.6s linear infinite}
.typed{transform-box:fill-box;transform-origin:left;transform:scaleX(0);animation:type 9s steps(16,end) infinite both}
.dot{fill:#2563eb}
.node{fill:#ffffff;stroke:#2563eb;stroke-width:2.5}
.row{opacity:0;animation:fadeup .6s ease forwards}
.fadeup{opacity:0;animation:fadeup 1s ease forwards}
.e1{animation-delay:.2s} .e2{animation-delay:.45s} .e3{animation-delay:.7s}
@keyframes rowin{to{opacity:1}}
@keyframes run{from{stroke-dashoffset:670}to{stroke-dashoffset:0}}
@keyframes type{0%{transform:scaleX(0)}14%,30%{transform:scaleX(1)}31%,100%{transform:scaleX(0)}}
@keyframes pulse{from{opacity:.12}to{opacity:.45}}
@keyframes fadeup{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>
